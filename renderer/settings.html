<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self'" />
    <title>AI 비서 설정</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <div class="panel">
      <header>
        <span class="title">설정</span>
        <button id="close" class="icon" title="닫기 (Esc)">✕</button>
      </header>

      <!-- 바로 하기 -->
      <div class="card quick">
        <div class="tools">
          <button id="focus" class="tool focus">🍅 집중 25분</button>
          <button id="askBtn" class="tool ask">💬 물어보기</button>
        </div>
        <div class="row between focus-len">
          <span title="분 단위 · 말로는 5~180분 아무거나">집중 시간</span>
          <div id="focusLen" class="seg"></div>
        </div>
      </div>

      <section>
        <h2>캐릭터</h2>
        <div class="card">
          <div id="chars3d" class="char-grid"></div>
          <div id="charsImg" class="chips img-chips"></div>
          <div class="row between line">
            <span title="캐릭터 위에서 마우스 휠을 굴려도 크기가 바뀌어요">크기</span>
            <div id="size" class="seg"></div>
          </div>
          <div class="row line">
            <button id="import" class="ghost small grow">＋ 이미지 불러오기</button>
            <button id="folder" class="ghost small">폴더 열기</button>
          </div>
        </div>
      </section>

      <section>
        <h2>꾸미기 <small class="hint">할 일·집중으로 레벨 업</small></h2>
        <div class="card">
          <div class="level">
            <b id="lvNum">Lv.1</b>
            <div class="lv-bar"><i id="lvBar"></i></div>
            <span id="lvXp" class="lv-xp">0 / 50</span>
          </div>
          <div id="items" class="item-grid"></div>
          <div class="hint lv-help">할 일 하나 +10 · 집중 한 번 +20 · 출석 +5</div>
        </div>
      </section>

      <section>
        <h2>일정 · 체크메이트</h2>
        <div class="card">
          <div class="row between">
            <span id="account">로그인 안 됨</span>
            <button id="auth" class="ghost small">로그인</button>
          </div>
          <div class="row between line">
            <span>미리 알림</span>
            <div id="remind" class="seg"></div>
          </div>
          <div class="row line">
            <button id="today" class="primary">📅 오늘 일정 보기</button>
            <button id="refresh" class="ghost small" title="체크메이트에서 다시 불러오기">↻</button>
          </div>
        </div>
      </section>

      <section>
        <h2>브리핑 · 날씨</h2>
        <div class="card">
          <form id="placeForm" class="row between">
            <span>동네 <b id="placeName" class="place-name">서울</b></span>
            <div class="row">
              <input id="placeInput" class="key-input place-input" type="text" placeholder="예: 수원" autocomplete="off" />
              <button id="placeFind" type="submit" class="ghost small">찾기</button>
            </div>
          </form>
          <div id="placeResults" class="chips"></div>
          <label class="row between switch-row line">
            <span>아침 브리핑 <small class="hint">아침에 처음 켤 때</small></span>
            <input id="briefing" type="checkbox" class="switch" />
          </label>
          <label class="row between switch-row line">
            <span>비 오기 전에 알려주기</span>
            <input id="rainAlert" type="checkbox" class="switch" />
          </label>
          <button id="briefNow" class="ghost wide line-btn">☀️ 지금 브리핑 보기</button>
        </div>
      </section>

      <section>
        <h2>AI 연결 <small class="hint">물어보기에서 모르는 것도 대답해요</small></h2>
        <div class="card">
          <div id="aiProvider" class="seg full"></div>
          <div id="aiStatus" class="ai-status"></div>
          <form id="aiForm" class="row">
            <input id="aiKey" class="key-input" type="password" autocomplete="off" spellcheck="false" placeholder="API 키 붙여 넣기" />
            <button id="aiSave" type="submit" class="ghost small">저장</button>
          </form>
          <div id="claudeModels" class="seg full"></div>
          <div class="row links">
            <button id="aiKeyPage" class="link">🔑 키 받으러 가기</button>
            <button id="aiClear" class="link muted">키 지우기</button>
          </div>
          <div id="aiMsg" class="ai-msg"></div>
        </div>
      </section>

      <section id="linkSection">
        <h2>다른 AI 앱과 연결</h2>
        <div class="card">
          <div class="row between">
            <span>🔌 Claude 앱 <small id="linkState" class="hint"></small></span>
            <button id="linkClaude" class="ghost small">연결하기</button>
          </div>
          <div class="hint link-help">Claude 앱에서 할 일 넣기·집중·알림을 나한테 부탁할 수 있어요. 연결한 뒤 Claude 앱을 껐다 켜 주세요.</div>
          <div id="linkMsg" class="ai-msg"></div>
        </div>
      </section>

      <section>
        <h2>건강 알림 <small class="hint">집중할 땐 쉬어요</small></h2>
        <div id="health" class="card"></div>
      </section>

      <section>
        <h2>기타</h2>
        <div class="card">
          <label class="row between switch-row">
            <span>집중할 때 딴짓 말리기 <small class="hint">유튜브·게임</small></span>
            <input id="focusGuard" type="checkbox" class="switch" />
          </label>
          <label class="row between switch-row line">
            <span>컴퓨터 켤 때 자동 실행</span>
            <input id="autostart" type="checkbox" class="switch" />
          </label>
        </div>
      </section>

      <footer>
        <button id="quit" class="danger">비서 끄기</button>
      </footer>
    </div>
    <script src="settings.js"></script>
  </body>
</html>
